<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifelog & Diet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            background-color: #F8FAF9;
            color: #1E2923;
        }
        .ios-card {
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 4px 20px -2px rgba(46, 74, 58, 0.05);
            border: 1px solid rgba(46, 74, 58, 0.04);
        }
    </style>
</head>
<body class="antialiased pb-12">
    <div id="app" class="max-w-md mx-auto px-4 pt-8">
        <!-- ヘッダー -->
        <header class="flex justify-between items-center mb-6">
            <div>
                <span class="text-xs font-semibold tracking-wider text-emerald-600 uppercase">Daily Record</span>
                <h1 class="text-2xl font-bold text-slate-800">コンディション記録</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="copyTodayLogs()" class="p-2.5 ios-card text-slate-600 hover:text-emerald-600 transition" title="今日のログコピー">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 012-2h2a2 2 0 012-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                </button>
                <button onclick="openNotionGuide()" class="p-2.5 ios-card text-slate-600 hover:text-emerald-600 transition" title="Notion埋め込み手順">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                </button>
            </div>
        </header>

        <!-- サマリーカード -->
        <div class="ios-card p-5 mb-6 bg-gradient-to-br from-emerald-500 to-teal-600 text-white">
            <div class="flex justify-between items-center mb-4">
                <span class="text-xs font-medium uppercase tracking-wider text-emerald-100">Today's Summary</span>
                <span id="current-date" class="text-xs bg-black/10 px-2.5 py-1 rounded-full font-medium"></span>
            </div>
            <div class="grid grid-cols-3 gap-2 text-center">
                <div class="bg-white/10 p-2.5 rounded-2xl backdrop-blur-sm">
                    <div class="text-[10px] text-emerald-100 mb-0.5">食事件数</div>
                    <div class="text-xl font-bold" id="meal-count">0 <span class="text-[10px] font-normal">件</span></div>
                </div>
                <div class="bg-white/10 p-2.5 rounded-2xl backdrop-blur-sm">
                    <div class="text-[10px] text-emerald-100 mb-0.5">カロリー合計</div>
                    <div class="text-xl font-bold" id="total-kcal">0 <span class="text-[10px] font-normal">kcal</span></div>
                </div>
                <div class="bg-white/10 p-2.5 rounded-2xl backdrop-blur-sm">
                    <div class="text-[10px] text-emerald-100 mb-0.5">タンパク質</div>
                    <div class="text-xl font-bold" id="total-protein">0 <span class="text-[10px] font-normal">g</span></div>
                </div>
            </div>
        </div>

        <!-- 入力フォームエリア -->
        <div class="ios-card p-5 mb-6" id="form-card">
            <!-- タブ切り替え（食事 / 運動・活動 / 体重） -->
            <div class="flex rounded-xl bg-slate-100 p-1 mb-4">
                <button onclick="switchTab('meal')" id="tab-meal" class="flex-1 py-2 text-xs font-semibold rounded-lg transition bg-white text-slate-800 shadow-sm">食事</button>
                <button onclick="switchTab('exercise')" id="tab-exercise" class="flex-1 py-2 text-xs font-semibold rounded-lg transition text-slate-500">運動・活動</button>
                <button onclick="switchTab('weight')" id="tab-weight" class="flex-1 py-2 text-xs font-semibold rounded-lg transition text-slate-500">体重</button>
            </div>

            <!-- クイックマスタ選択 -->
            <div id="quick-master-wrap" class="mb-4">
                <div class="text-xs font-semibold text-slate-400 mb-2">よく使うマスタ（タップで自動引用）</div>
                <div id="quick-tags" class="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto p-1"></div>
            </div>

            <form id="record-form" onsubmit="handleSubmit(event)" class="space-y-4">
                <input type="hidden" id="editing-id" value="">
                <input type="hidden" id="record-type" value="meal">

                <!-- 記録時間選択 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5">記録時間</label>
                    <div class="flex gap-2 items-center">
                        <input type="time" id="item-time" required class="flex-1 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 transition">
                        <div class="flex gap-1">
                            <button type="button" onclick="setTime('09:00')" class="px-2.5 py-2 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-600 rounded-lg text-xs font-medium transition">朝 9:00</button>
                            <button type="button" onclick="setTime('12:00')" class="px-2.5 py-2 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-600 rounded-lg text-xs font-medium transition">昼 12:00</button>
                            <button type="button" onclick="setTime('19:00')" class="px-2.5 py-2 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-600 rounded-lg text-xs font-medium transition">夜 19:00</button>
                        </div>
                    </div>
                </div>

                <!-- 食事区分（食事タブのみ） -->
                <div id="meal-kind-wrap">
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5">食事区分</label>
                    <select id="meal-kind" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 transition">
                        <option value="朝食">朝食</option>
                        <option value="昼食">昼食</option>
                        <option value="夕食">夕食</option>
                        <option value="間食">間食</option>
                    </select>
                </div>

                <!-- 名称 / メニュー名 -->
                <div id="item-name-wrap">
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5" id="input-label">メニュー名</label>
                    <input type="text" id="item-name" placeholder="例: 若鶏のディアボラ風、スモールライス" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 transition">
                </div>

                <!-- カロリー & タンパク質（食事タブ専用） -->
                <div id="nutrition-wrap" class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1.5">カロリー (kcal)</label>
                        <input type="number" id="item-kcal" step="1" min="0" placeholder="例: 964" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1.5">タンパク質 (g)</label>
                        <input type="number" id="item-protein" step="0.1" min="0" placeholder="例: 42.0" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 transition">
                    </div>
                </div>

                <!-- 体重（体重タブ専用） -->
                <div id="weight-wrap" class="hidden">
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5">体重 (kg)</label>
                    <input type="number" id="item-weight" step="0.1" min="0" placeholder="例: 54.5" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 transition">
                </div>

                <!-- 詳細・メモ -->
                <div id="memo-wrap">
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5" id="memo-label">詳細・メモ</label>
                    <input type="text" id="item-memo" placeholder="例: 起床直後、自炊など" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 transition">
                </div>

                <div class="flex gap-2 pt-1">
                    <button type="submit" id="submit-btn" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-sm shadow-lg shadow-emerald-600/20 transition">
                        記録を追加する
                    </button>
                    <button type="button" id="cancel-edit-btn" onclick="cancelEdit()" class="hidden py-3 px-4 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-xl text-sm transition">
                        キャンセル
                    </button>
                </div>
            </form>
        </div>

        <!-- 本日のログ一覧 -->
        <div class="ios-card p-5 mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold text-slate-800 text-sm">今日のタイムライン</h2>
                <button onclick="copyTodayLogs()" class="text-xs font-semibold text-emerald-600 hover:text-emerald-700 flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 012-2h2a2 2 0 012-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    一括コピー
                </button>
            </div>
            <div id="log-list" class="space-y-3">
                <!-- 動的に生成 -->
            </div>
        </div>

        <!-- バックアップ・データ管理（最下段） -->
        <div class="ios-card p-5 mb-6 border border-slate-200/60 bg-slate-50/50">
            <h3 class="font-bold text-xs text-slate-500 uppercase tracking-wider mb-3">データ管理・バックアップ</h3>
            <div class="flex gap-3">
                <button onclick="exportAllLogsJson()" class="flex-1 py-2.5 px-3 bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 font-semibold rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-xs transition">
                    <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    JSONで書き出し
                </button>
                <button onclick="document.getElementById('import-file-input').click()" class="flex-1 py-2.5 px-3 bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 font-semibold rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-xs transition">
                    <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    JSONをインポート
                </button>
                <input type="file" id="import-file-input" accept="application/json,.json" class="hidden" onchange="importLogsJson(event)">
            </div>
            <p class="text-[11px] text-slate-400 mt-2.5 leading-normal">
                これまでの全記録をJSON形式でローカルに保存したり、バックアップファイルから復元できます。
            </p>
        </div>
    </div>

    <!-- Notion案内モーダル -->
    <div id="notion-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
        <div class="ios-card bg-white p-6 max-w-sm w-full">
            <h3 class="font-bold text-base text-slate-800 mb-2">Notionへの組み込み方法</h3>
            <p class="text-xs text-slate-600 leading-relaxed mb-4">
                1. このアプリをGitHub Pages等にアップロードしてURLを発行します。<br>
                2. Notionのページで <code class="bg-slate-100 px-1 py-0.5 rounded text-emerald-600">/embed</code> と入力します。<br>
                3. 発行したURLを貼り付けると、Notionの中にこのアプリがそのまま組み込まれます。
            </p>
            <button onclick="closeNotionGuide()" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 font-semibold rounded-xl text-xs text-slate-700 transition">閉じる</button>
        </div>
    </div>

    <script>
        // 添付ログ(JSON)由来のマスタ
        const defaultMealMasters = {
            "若鶏のディアボラ風、スモールライス": { kcal: 964, protein: 42.0 },
            "鶏もも肉ステーキディアボラ風": { kcal: 206, protein: 13.2 },
            "牛めし、味噌汁": { kcal: 687, protein: 17.1 },
            "塩レモンチキンバーガー、ポテトS": { kcal: 620, protein: 16.7 },
            "フライドチキン、ビスケット、ポテト": { kcal: 600, protein: 22.0 },
            "ワッパーjr,ポテト小": { kcal: 549, protein: 16.8 },
            "海鮮焼きそば": { kcal: 425, protein: 17.4 },
            "食パン": { kcal: 226, protein: 6.6 },
            "オイコス": { kcal: 89, protein: 10.2 },
            "プロテインバー": { kcal: 188, protein: 16.0 },
            "寿司": { kcal: 266, protein: 8.9 },
            "春巻": { kcal: 220, protein: 3.4 },
            "チーズケーキ": { kcal: 145, protein: 5.1 },
            "チョコプリン": { kcal: 256, protein: 4.5 },
            "フィナンシェ": { kcal: 119, protein: 1.8 },
            "ベルギーワッフル": { kcal: 209, protein: 3.8 }
        };

        let masters = JSON.parse(localStorage.getItem('diet_masters_v2')) || {
            meal: defaultMealMasters,
            exercise: ['スクワット', 'リングフィット', '歩数', 'デッドバグ', 'ストレッチ', 'フィットネスボクシング']
        };

        let logs = JSON.parse(localStorage.getItem('diet_logs')) || [];

        // 現在時刻の初期セット (HH:MM)
        function getNowTimeStr() {
            const d = new Date();
            return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }
        document.getElementById('item-time').value = getNowTimeStr();

        function setTime(timeStr) {
            document.getElementById('item-time').value = timeStr;
        }

        // 日付表示
        const todayStr = new Date().toLocaleDateString('ja-JP', { month: 'short', day: 'numeric', weekday: 'short' });
        document.getElementById('current-date').textContent = todayStr;

        function switchTab(type) {
            document.getElementById('record-type').value = type;
            
            const isMeal = type === 'meal';
            const isExercise = type === 'exercise';
            const isWeight = type === 'weight';

            document.getElementById('tab-meal').className = `flex-1 py-2 text-xs font-semibold rounded-lg transition ${isMeal ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`;
            document.getElementById('tab-exercise').className = `flex-1 py-2 text-xs font-semibold rounded-lg transition ${isExercise ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`;
            document.getElementById('tab-weight').className = `flex-1 py-2 text-xs font-semibold rounded-lg transition ${isWeight ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`;

            document.getElementById('meal-kind-wrap').style.display = isMeal ? 'block' : 'none';
            document.getElementById('item-name-wrap').style.display = isWeight ? 'none' : 'block';
            document.getElementById('nutrition-wrap').className = isMeal ? 'grid grid-cols-2 gap-3' : 'hidden';
            document.getElementById('weight-wrap').className = isWeight ? 'block' : 'hidden';
            document.getElementById('quick-master-wrap').style.display = isWeight ? 'none' : 'block';

            document.getElementById('input-label').textContent = isMeal ? 'メニュー名' : '運動・活動名';
            document.getElementById('memo-label').textContent = isWeight ? 'メモ（任意）' : '詳細・メモ';

            renderQuickTags();
        }

        function renderQuickTags() {
            const type = document.getElementById('record-type').value;
            const container = document.getElementById('quick-tags');
            container.innerHTML = '';

            if (type === 'meal') {
                Object.keys(masters.meal).forEach(name => {
                    const info = masters.meal[name];
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'text-xs bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-600 px-3 py-1.5 rounded-full transition font-medium text-left';
                    btn.textContent = `+ ${name} (${info.kcal || '—'}kcal / P:${info.protein || '—'}g)`;
                    btn.onclick = () => {
                        document.getElementById('item-name').value = name;
                        if (info.kcal !== null && info.kcal !== undefined) document.getElementById('item-kcal').value = info.kcal;
                        if (info.protein !== null && info.protein !== undefined) document.getElementById('item-protein').value = info.protein;
                    };
                    container.appendChild(btn);
                });
            } else if (type === 'exercise') {
                masters.exercise.forEach(item => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'text-xs bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-600 px-3 py-1.5 rounded-full transition font-medium';
                    btn.textContent = `+ ${item}`;
                    btn.onclick = () => {
                        document.getElementById('item-name').value = item;
                    };
                    container.appendChild(btn);
                });
            }
        }

        document.getElementById('item-name').addEventListener('input', (e) => {
            const type = document.getElementById('record-type').value;
            if (type !== 'meal') return;
            const val = e.target.value.trim();
            if (masters.meal[val]) {
                const info = masters.meal[val];
                if (info.kcal) document.getElementById('item-kcal').value = info.kcal;
                if (info.protein) document.getElementById('item-protein').value = info.protein;
            }
        });

        function handleSubmit(e) {
            e.preventDefault();
            const editingId = document.getElementById('editing-id').value;
            const type = document.getElementById('record-type').value;
            const time = document.getElementById('item-time').value || getNowTimeStr();
            const name = document.getElementById('item-name').value.trim();
            const memo = document.getElementById('item-memo').value.trim();
            const mealKind = document.getElementById('meal-kind').value;
            
            const kcalVal = document.getElementById('item-kcal').value.trim();
            const proteinVal = document.getElementById('item-protein').value.trim();
            const weightVal = document.getElementById('item-weight').value.trim();

            const kcal = kcalVal !== '' ? Number(kcalVal) : null;
            const protein = proteinVal !== '' ? Number(proteinVal) : null;
            const weight = weightVal !== '' ? weightVal : null;

            if (type !== 'weight' && !name) return;
            if (type === 'weight' && !weight) return;

            // マスタ更新（食事）
            if (type === 'meal' && name) {
                masters.meal[name] = { kcal: kcal, protein: protein };
                localStorage.setItem('diet_masters_v2', JSON.stringify(masters));
            } else if (type === 'exercise' && name && !masters.exercise.includes(name)) {
                masters.exercise.push(name);
                localStorage.setItem('diet_masters_v2', JSON.stringify(masters));
            }

            if (editingId) {
                // 既存ログの編集
                const idx = logs.findIndex(l => String(l.id) === String(editingId));
                if (idx !== -1) {
                    logs[idx] = {
                        ...logs[idx],
                        time,
                        type,
                        mealKind: type === 'meal' ? mealKind : null,
                        name: type === 'weight' ? '体重記録' : name,
                        kcal: type === 'meal' ? kcal : null,
                        protein: type === 'meal' ? protein : null,
                        weight: type === 'weight' ? weight : null,
                        memo,
                        updated: Date.now()
                    };
                }
            } else {
                // 新規ログ追加
                const newLog = {
                    id: crypto.randomUUID ? crypto.randomUUID() : Date.now(),
                    date: new Date().toISOString().split('T')[0],
                    time,
                    type,
                    mealKind: type === 'meal' ? mealKind : null,
                    name: type === 'weight' ? '体重記録' : name,
                    kcal: type === 'meal' ? kcal : null,
                    protein: type === 'meal' ? protein : null,
                    weight: type === 'weight' ? weight : null,
                    memo,
                    created: Date.now()
                };
                logs.unshift(newLog);
            }

            localStorage.setItem('diet_logs', JSON.stringify(logs));
            cancelEdit();
            renderLogs();
            renderQuickTags();
        }

        function startEditLog(id) {
            const target = logs.find(l => String(l.id) === String(id));
            if (!target) return;

            // 種別判定（旧データ互換: kind, meal などのキーもケア）
            let kind = target.type || target.kind || 'meal';
            if (kind === '食事') kind = 'meal';
            if (kind === '運動') kind = 'exercise';
            if (kind === '体重') kind = 'weight';

            switchTab(kind);

            document.getElementById('editing-id').value = target.id;
            document.getElementById('item-time').value = target.time || getNowTimeStr();
            if (kind === 'meal') {
                document.getElementById('meal-kind').value = target.mealKind || target.meal || '朝食';
                document.getElementById('item-name').value = target.name || target.detail || '';
                document.getElementById('item-kcal').value = target.kcal ?? '';
                document.getElementById('item-protein').value = target.protein ?? '';
            } else if (kind === 'weight') {
                document.getElementById('item-weight').value = target.weight || target.extra || (target.detail ? target.detail.replace('kg','') : '');
            } else {
                document.getElementById('item-name').value = target.name || target.detail || '';
            }
            document.getElementById('item-memo').value = target.memo || (kind !== 'weight' ? target.extra || '' : '');

            document.getElementById('submit-btn').textContent = '変更を保存する';
            document.getElementById('cancel-edit-btn').classList.remove('hidden');

            document.getElementById('form-card').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelEdit() {
            document.getElementById('editing-id').value = '';
            document.getElementById('item-name').value = '';
            document.getElementById('item-kcal').value = '';
            document.getElementById('item-protein').value = '';
            document.getElementById('item-weight').value = '';
            document.getElementById('item-memo').value = '';
            document.getElementById('item-time').value = getNowTimeStr();

            document.getElementById('submit-btn').textContent = '記録を追加する';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        function deleteLog(id) {
            if (!confirm('この記録を削除してもよろしいですか？')) return;
            logs = logs.filter(log => String(log.id) !== String(id));
            localStorage.setItem('diet_logs', JSON.stringify(logs));
            renderLogs();
        }

        function renderLogs() {
            const today = new Date().toISOString().split('T')[0];
            const todayLogs = logs.filter(log => log.date === today);
            
            const mealCount = todayLogs.filter(l => (l.type === 'meal' || l.kind === '食事')).length;
            const totalKcal = todayLogs.filter(l => (l.type === 'meal' || l.kind === '食事') && l.kcal).reduce((sum, l) => sum + Number(l.kcal), 0);
            const totalProtein = todayLogs.filter(l => (l.type === 'meal' || l.kind === '食事') && l.protein).reduce((sum, l) => sum + Number(l.protein), 0);

            document.getElementById('meal-count').innerHTML = `${mealCount} <span class="text-[10px] font-normal">件</span>`;
            document.getElementById('total-kcal').innerHTML = `${Math.round(totalKcal)} <span class="text-[10px] font-normal">kcal</span>`;
            document.getElementById('total-protein').innerHTML = `${totalProtein.toFixed(1)} <span class="text-[10px] font-normal">g</span>`;

            const container = document.getElementById('log-list');
            if (todayLogs.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">本日の記録はまだありません</div>`;
                return;
            }

            container.innerHTML = todayLogs.map(log => {
                let kind = log.type || log.kind;
                if (kind === '食事') kind = 'meal';
                if (kind === '運動') kind = 'exercise';
                if (kind === '体重') kind = 'weight';

                let badgeColor = 'bg-amber-100 text-amber-700';
                let icon = '🍽️';
                let title = log.name || log.detail || '';
                let subText = [];

                if (kind === 'meal') {
                    const mealCategory = log.mealKind || log.meal;
                    if (mealCategory) title = `[${mealCategory}] ` + title;
                    if (log.kcal) subText.push(`${log.kcal} kcal`);
                    if (log.protein) subText.push(`P:${log.protein}g`);
                } else if (kind === 'exercise') {
                    badgeColor = 'bg-emerald-100 text-emerald-700';
                    icon = '⚡';
                } else if (kind === 'weight') {
                    badgeColor = 'bg-blue-100 text-blue-700';
                    icon = '⚖️';
                    const wVal = log.weight || log.extra || (log.detail ? log.detail.replace('kg','') : '');
                    title = `体重: ${wVal} kg`;
                }

                const memoVal = log.memo || (kind !== 'weight' ? log.extra : '');
                if (memoVal) subText.push(memoVal);

                return `
                <div class="flex items-center justify-between p-3 rounded-2xl bg-slate-50 border border-slate-100">
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="w-9 h-9 rounded-xl flex-shrink-0 flex items-center justify-center ${badgeColor}">
                            ${icon}
                        </div>
                        <div class="min-w-0">
                            <div class="text-sm font-semibold text-slate-800 truncate">${escapeHtml(title)}</div>
                            <div class="text-xs text-slate-400 truncate">${log.time || '--:--'} ${subText.length ? '• ' + escapeHtml(subText.join(' / ')) : ''}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 flex-shrink-0 ml-2">
                        <button onclick="startEditLog('${log.id}')" class="text-xs text-slate-500 hover:text-emerald-600 bg-white hover:bg-slate-100 px-2 py-1 rounded-lg border border-slate-200 transition">
                            編集
                        </button>
                        <button onclick="deleteLog('${log.id}')" class="text-slate-300 hover:text-rose-500 p-1 transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        function copyTodayLogs() {
            const today = new Date().toISOString().split('T')[0];
            const todayLogs = logs.filter(log => log.date === today);
            if (todayLogs.length === 0) {
                alert('コピーする本日のログがありません。');
                return;
            }

            let text = `### 📋 ${todayStr} の記録
`;
            todayLogs.forEach(l => {
                let kind = l.type || l.kind;
                let icon = '🍽️';
                let detail = l.name || l.detail;
                if (kind === '運動' || kind === 'exercise') icon = '⚡';
                if (kind === '体重' || kind === 'weight') {
                    icon = '⚖️';
                    const wVal = l.weight || l.extra || l.detail;
                    detail = `体重 ${wVal}kg`;
                }

                let meta = [];
                if (l.kcal) meta.push(`${l.kcal}kcal`);
                if (l.protein) meta.push(`P:${l.protein}g`);
                const memoVal = l.memo || (kind !== 'weight' ? l.extra : '');
                if (memoVal) meta.push(memoVal);

                text += `- ${icon} [${l.time || ''}] **${detail}** ${meta.length ? '(' + meta.join(', ') + ')' : ''}
`;
            });

            navigator.clipboard.writeText(text).then(() => {
                alert('今日のログをMarkdown形式でクリップボードにコピーしました！');
            });
        }

        // 全ログのJSON書き出し（添付ログのフォーマット互換）
        function exportAllLogsJson() {
            const exportData = {
                app: "RikuDietLog",
                version: 2,
                exportedAt: new Date().toISOString(),
                records: logs
            };

            const jsonStr = JSON.stringify(exportData, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const today = new Date().toISOString().split('T')[0];
            a.href = url;
            a.download = `diet-log-${today}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // 全ログのJSONインポート
        function importLogsJson(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    let importedRecords = [];

                    if (Array.isArray(data)) {
                        importedRecords = data;
                    } else if (data && Array.isArray(data.records)) {
                        importedRecords = data.records;
                    } else {
                        throw new Error("無効なJSONフォーマットです。");
                    }

                    // 重複しないようにIDでマージ・更新
                    const existingMap = new Map(logs.map(l => [String(l.id), l]));
                    importedRecords.forEach(rec => {
                        if (rec.id) existingMap.set(String(rec.id), rec);
                    });

                    logs = Array.from(existingMap.values());
                    // 日付降順・時間降順でソート
                    logs.sort((a, b) => (b.date + (b.time||'')).localeCompare(a.date + (a.time||'')));

                    localStorage.setItem('diet_logs', JSON.stringify(logs));
                    renderLogs();
                    alert(`正常にインポートしました。（全 ${logs.length} 件）`);
                } catch (err) {
                    alert('JSONファイルの読み込みに失敗しました。正しいフォーマットか確認してください。');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function openNotionGuide() {
            document.getElementById('notion-modal').classList.remove('hidden');
            document.getElementById('notion-modal').classList.add('flex');
        }

        function closeNotionGuide() {
            document.getElementById('notion-modal').classList.remove('flex');
            document.getElementById('notion-modal').classList.add('hidden');
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        // 初期描画
        switchTab('meal');
        renderLogs();
    </script>
</body>
