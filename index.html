<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifelog & Diet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            background-color: #F8FAF9;
            color: #1E2923;
        }
        .ios-card {
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 4px 20px -2px rgba(46, 74, 58, 0.05);
            border: 1px solid rgba(46, 74, 58, 0.04);
        }
    </style>
</head>
<body class="antialiased pb-12">
    <div id="app" class="max-w-md mx-auto px-4 pt-8">
        <!-- ヘッダー -->
        <header class="flex justify-between items-center mb-6">
            <div>
                <span class="text-xs font-semibold tracking-wider text-emerald-600 uppercase">Daily Record</span>
                <h1 class="text-2xl font-bold text-slate-800">コンディション記録</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="exportLogs()" class="p-2.5 ios-card text-slate-600 hover:text-emerald-600 transition" title="今日のログ出力">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 012-2h2a2 2 0 012-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                </button>
                <button onclick="openNotionGuide()" class="p-2.5 ios-card text-slate-600 hover:text-emerald-600 transition" title="Notion埋め込み手順">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                </button>
            </div>
        </header>

        <!-- サマリーカード -->
        <div class="ios-card p-5 mb-6 bg-gradient-to-br from-emerald-500 to-teal-600 text-white">
            <div class="flex justify-between items-center mb-4">
                <span class="text-xs font-medium uppercase tracking-wider text-emerald-100">Today's Summary</span>
                <span id="current-date" class="text-xs bg-black/10 px-2.5 py-1 rounded-full font-medium"></span>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white/10 p-3.5 rounded-2xl backdrop-blur-sm">
                    <div class="text-xs text-emerald-100 mb-1">食事記録</div>
                    <div class="text-2xl font-bold" id="meal-count">0 <span class="text-xs font-normal">件</span></div>
                </div>
                <div class="bg-white/10 p-3.5 rounded-2xl backdrop-blur-sm">
                    <div class="text-xs text-emerald-100 mb-1">運動・活動</div>
                    <div class="text-2xl font-bold" id="exercise-count">0 <span class="text-xs font-normal">件</span></div>
                </div>
            </div>
        </div>

        <!-- 入力フォームエリア -->
        <div class="ios-card p-5 mb-6">
            <div class="flex rounded-xl bg-slate-100 p-1 mb-4">
                <button onclick="switchTab('meal')" id="tab-meal" class="flex-1 py-2 text-sm font-semibold rounded-lg transition bg-white text-slate-800 shadow-sm">食事</button>
                <button onclick="switchTab('exercise')" id="tab-exercise" class="flex-1 py-2 text-sm font-semibold rounded-lg transition text-slate-500">運動・活動</button>
            </div>

            <!-- クイックマスタ選択 -->
            <div class="mb-3">
                <div class="text-xs font-semibold text-slate-400 mb-2">よく使う項目（タップで入力）</div>
                <div id="quick-tags" class="flex flex-wrap gap-1.5"></div>
            </div>

            <form id="record-form" onsubmit="handleSubmit(event)" class="space-y-4">
                <input type="hidden" id="record-type" value="meal">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5" id="input-label">メニュー名</label>
                    <input type="text" id="item-name" required placeholder="例: 鶏胸肉のソテー" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5">詳細・メモ・数量</label>
                    <input type="text" id="item-memo" placeholder="例: 1人前、20分など" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 transition">
                </div>
                <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-sm shadow-lg shadow-emerald-600/20 transition">
                    記録を追加する
                </button>
            </form>
        </div>

        <!-- 本日のログ一覧 -->
        <div class="ios-card p-5 mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold text-slate-800 text-sm">今日のタイムライン</h2>
                <button onclick="copyTodayLogs()" class="text-xs font-semibold text-emerald-600 hover:text-emerald-700 flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    一括コピー
                </button>
            </div>
            <div id="log-list" class="space-y-3">
                <!-- 動的に生成 -->
            </div>
        </div>
    </div>

    <!-- Notion案内モーダル -->
    <div id="notion-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
        <div class="ios-card bg-white p-6 max-w-sm w-full">
            <h3 class="font-bold text-base text-slate-800 mb-2">Notionへの組み込み方法</h3>
            <p class="text-xs text-slate-600 leading-relaxed mb-4">
                1. このアプリをGitHub Pages等にアップロードしてURLを発行します。<br>
                2. Notionのページで <code class="bg-slate-100 px-1 py-0.5 rounded text-emerald-600">/embed</code> と入力します。<br>
                3. 発行したURLを貼り付けると、Notionの中にこのアプリがそのまま組み込まれます。
            </p>
            <button onclick="closeNotionGuide()" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 font-semibold rounded-xl text-xs text-slate-700 transition">閉じる</button>
        </div>
    </div>

    <script>
        // 初期マスタデータ
        let masters = JSON.parse(localStorage.getItem('diet_masters')) || {
            meal: ['サラダチキン', 'プロテイン', 'オートミール', '味噌汁', 'ゆで卵'],
            exercise: ['スクワット', 'リングフィット', '歩数 (5000歩)', 'ストレッチ', 'フィットネスボクシング']
        };

        let logs = JSON.parse(localStorage.getItem('diet_logs')) || [];

        // 日付表示
        const todayStr = new Date().toLocaleDateString('ja-JP', { month: 'short', day: 'numeric', weekday: 'short' });
        document.getElementById('current-date').textContent = todayStr;

        function switchTab(type) {
            document.getElementById('record-type').value = type;
            const isMeal = type === 'meal';
            document.getElementById('tab-meal').className = `flex-1 py-2 text-sm font-semibold rounded-lg transition ${isMeal ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`;
            document.getElementById('tab-exercise').className = `flex-1 py-2 text-sm font-semibold rounded-lg transition ${!isMeal ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`;
            document.getElementById('input-label').textContent = isMeal ? 'メニュー名' : '運動・活動名';
            renderQuickTags();
        }

        function renderQuickTags() {
            const type = document.getElementById('record-type').value;
            const container = document.getElementById('quick-tags');
            container.innerHTML = '';
            masters[type].forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'text-xs bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-600 px-3 py-1.5 rounded-full transition font-medium';
                btn.textContent = `+ ${item}`;
                btn.onclick = () => {
                    document.getElementById('item-name').value = item;
                };
                container.appendChild(btn);
            });
        }

        function handleSubmit(e) {
            e.preventDefault();
            const type = document.getElementById('record-type').value;
            const name = document.getElementById('item-name').value.trim();
            const memo = document.getElementById('item-memo').value.trim();

            if (!name) return;

            // マスタへの自動登録（重複なし）
            if (!masters[type].includes(name)) {
                masters[type].push(name);
                localStorage.setItem('diet_masters', JSON.stringify(masters));
            }

            const newLog = {
                id: Date.now(),
                date: new Date().toISOString().split('T')[0],
                time: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
                type,
                name,
                memo
            };

            logs.unshift(newLog);
            localStorage.setItem('diet_logs', JSON.stringify(logs));

            document.getElementById('item-name').value = '';
            document.getElementById('item-memo').value = '';
            renderLogs();
            renderQuickTags();
        }

        function deleteLog(id) {
            logs = logs.filter(log => log.id !== id);
            localStorage.setItem('diet_logs', JSON.stringify(logs));
            renderLogs();
        }

        function renderLogs() {
            const today = new Date().toISOString().split('T')[0];
            const todayLogs = logs.filter(log => log.date === today);
            
            const mealCount = todayLogs.filter(l => l.type === 'meal').length;
            const exerciseCount = todayLogs.filter(l => l.type === 'exercise').length;
            document.getElementById('meal-count').innerHTML = `${mealCount} <span class="text-xs font-normal">件</span>`;
            document.getElementById('exercise-count').innerHTML = `${exerciseCount} <span class="text-xs font-normal">件</span>`;

            const container = document.getElementById('log-list');
            if (todayLogs.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">本日の記録はまだありません</div>`;
                return;
            }

            container.innerHTML = todayLogs.map(log => `
                <div class="flex items-center justify-between p-3 rounded-2xl bg-slate-50 border border-slate-100">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-xl flex items-center justify-center ${log.type === 'meal' ? 'bg-amber-100 text-amber-600' : 'bg-emerald-100 text-emerald-600'}">
                            ${log.type === 'meal' ? '🍽️' : '⚡'}
                        </div>
                        <div>
                            <div class="text-sm font-semibold text-slate-800">${escapeHtml(log.name)}</div>
                            <div class="text-xs text-slate-400">${log.time} ${log.memo ? '• ' + escapeHtml(log.memo) : ''}</div>
                        </div>
                    </div>
                    <button onclick="deleteLog(${log.id})" class="text-slate-300 hover:text-rose-500 p-1 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
            `).join('');
        }

        function copyTodayLogs() {
            const today = new Date().toISOString().split('T')[0];
            const todayLogs = logs.filter(log => log.date === today);
            if (todayLogs.length === 0) {
                alert('コピーする本日のログがありません。');
                return;
            }

            let text = `### 📋 ${todayStr} の記録
`;
            todayLogs.forEach(l => {
                const icon = l.type === 'meal' ? '🍽️' : '⚡';
                text += `- ${icon} [${l.time}] **${l.name}** ${l.memo ? '(' + l.memo + ')' : ''}
`;
            });

            navigator.clipboard.writeText(text).then(() => {
                alert('今日のログをMarkdown形式でクリップボードにコピーしました！');
            });
        }

        function exportLogs() {
            copyTodayLogs();
        }

        function openNotionGuide() {
            document.getElementById('notion-modal').classList.remove('hidden');
            document.getElementById('notion-modal').classList.add('flex');
        }

        function closeNotionGuide() {
            document.getElementById('notion-modal').classList.remove('flex');
            document.getElementById('notion-modal').classList.add('hidden');
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        // 初期描画
        renderQuickTags();
        renderLogs();
    </script>
</body>
</html>
